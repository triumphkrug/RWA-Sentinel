name: Build & Test
on: [push, pull_request]
jobs:
  lint-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx eslint agent/src --ext .ts
      - run: npx prettier --check 'agent/src/**/*.ts'

  test-ts:
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx jest --ci --coverage

  build-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cd contracts/asset-registry && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - run: cd contracts/attestation-store && cargo build --release --target wasm32-unknown-unknown --no-default-features

  test-contracts:
    runs-on: ubuntu-latest
    needs: build-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd contracts/tests && cargo test --release
