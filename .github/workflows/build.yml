name: build & verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd agent && npm ci
      - run: cd agent && npx tsc --noEmit
      - run: cd agent && npm test -- --passWithNoTests
      - run: cd frontend && npm ci && npm run build
